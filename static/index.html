<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini AI BI Assistant</title>
<style>
body{font-family:system-ui,sans-serif;max-width:820px;margin:2rem auto;padding:0 1rem;color:#1a1a1a}
input{width:100%;padding:.7rem;font-size:1rem;box-sizing:border-box}
button{padding:.6rem 1.2rem;margin-top:.5rem;font-size:1rem;cursor:pointer}
.chips button{font-size:.8rem;margin:.2rem .2rem 0 0;padding:.3rem .6rem}
table{border-collapse:collapse;margin-top:.5rem}td,th{border:1px solid #ccc;padding:.35rem .7rem;text-align:left}
pre{background:#f4f4f4;padding:.7rem;overflow:auto}.err{color:#b00020}.ans{font-size:1.1rem;font-weight:600}
</style></head><body>
<h1>Mini AI BI Assistant</h1>
<form id="f"><input id="q" placeholder="Ask about sales, e.g. What is the total revenue?" autofocus>
<button>Ask</button></form>
<div class="chips" id="chips"></div>
<div id="out"></div>
<script>
const ex=["What is the total revenue?","Which product generated the highest revenue?","What is the monthly revenue trend?","Which region generated the highest sales?","How did revenue change between February and March?"];
const q=document.getElementById("q"),out=document.getElementById("out");
function el(t,txt,cls){const e=document.createElement(t);if(txt!==undefined)e.textContent=txt;if(cls)e.className=cls;return e}
ex.forEach(t=>{const b=el("button",t);b.type="button";b.onclick=()=>{q.value=t;ask()};document.getElementById("chips").append(b)});
document.getElementById("f").onsubmit=e=>{e.preventDefault();ask()};
async function ask(){
  out.replaceChildren(el("p","Thinking…"));
  try{
    const r=await fetch("/ask",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({question:q.value})});
    const j=await r.json();
    if(!r.ok){out.replaceChildren(el("p",j.error||"Error","err"));return}
    const t=el("table"),h=el("tr");j.columns.forEach(c=>h.append(el("th",c)));t.append(h);
    j.rows.forEach(r=>{const tr=el("tr");r.forEach(v=>tr.append(el("td",v)));t.append(tr)});
    out.replaceChildren(el("p",j.answer,"ans"),el("h3","Supporting data"),t,el("h3","SQL executed"),el("pre",j.sql+(j.params?"\n-- params: "+JSON.stringify(j.params):"")));
  }catch(e){out.replaceChildren(el("p","Request failed: "+e,"err"))}
}
</script></body></html>
